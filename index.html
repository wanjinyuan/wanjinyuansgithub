<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>贪吃蛇</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#111;color:#fff;display:flex;flex-direction:column;align-items:center;padding:20px}
#game{border:2px solid #444;background:#000}
.info{margin-bottom:10px;font-size:18px}
button{padding:6px 14px;margin:0 4px;border:none;border-radius:6px;background:#28a745;color:#fff;font-size:16px;cursor:pointer}
button:hover{background:#218838}
</style>
</head>
<body>
<div class="info">分数：<span id="score">0</span>
<button onclick="startGame()">开始/重启</button>
</div>
<canvas id="game" width="400" height="400"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreDom = document.getElementById('score');
const size = 20;
const cnt = canvas.width / size;
let snake = [];
let food = {};
let dx = 1, dy = 0;
let score = 0;
let run = false;
let timer;

function randPos(){
    return Math.floor(Math.random()*cnt);
}
function newFood(){
    let nx,ny;
    do{
        nx=randPos();
        ny=randPos();
    }while(snake.some(p=>p.x===nx&&p.y===ny));
    food={x:nx,y:ny};
}
function init(){
    snake = [{x:5,y:5},{x:4,y:5},{x:3,y:5}];
    dx=1;dy=0;
    score=0;
    scoreDom.textContent=score;
    newFood();
}
function draw(){
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#0f0';
    snake.forEach(p=>{
        ctx.fillRect(p.x*size,p.y*size,size-2,size-2);
    })
    ctx.fillStyle='#f33';
    ctx.fillRect(food.x*size,food.y*size,size-2,size-2);
}
function update(){
    const head = {x:snake[0].x+dx, y:snake[0].y+dy};
    if(head.x<0||head.y<0||head.x>=cnt||head.y>=cnt){
        gameOver();
        return;
    }
    if(snake.some(p=>p.x===head.x&&p.y===head.y)){
        gameOver();
        return;
    }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){
        score+=10;
        scoreDom.textContent=score;
        newFood();
    }else{
        snake.pop();
    }
    draw();
}
function gameOver(){
    run=false;
    clearInterval(timer);
    alert('游戏结束！分数：'+score);
}
function startGame(){
    clearInterval(timer);
    init();
    run=true;
    draw();
    timer=setInterval(update,120);
}
document.addEventListener('keydown',e=>{
    if(!run) return;
    if(e.key==='ArrowUp'&&dy!==1){dx=0;dy=-1;}
    if(e.key==='ArrowDown'&&dy!==-1){dx=0;dy=1;}
    if(e.key==='ArrowLeft'&&dx!==1){dx=-1;dy=0;}
    if(e.key==='ArrowRight'&&dx!==-1){dx=1;dy=0;}
})
</script>
</body>
</html>
